
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 | Avex</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #101116;
    color: #f5f6fa;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 480px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.logo {
    color: #4285ff;
    font-size: 25px;
    font-weight: bold;
}

a {
    color: #70a5ff;
    text-decoration: none;
}

h1 {
    font-size: 65px;
    margin: 0;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.score {
    background: #222633;
    padding: 12px 20px;
    border-radius: 10px;
    text-align: center;
}

.score small {
    color: #a1a5b3;
    display: block;
}

.score strong {
    font-size: 22px;
}

button {
    background: #4285ff;
    border: 0;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

button:hover {
    background: #70a5ff;
}

#board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    background: #191b24;
    padding: 10px;
    border-radius: 12px;
    touch-action: none;
}

.cell {
    aspect-ratio: 1;
    background: #292d39;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(20px, 7vw, 36px);
    font-weight: bold;
}

.v2 { background: #eee4da; color: #333; }
.v4 { background: #ede0c8; color: #333; }
.v8 { background: #f2b179; color: white; }
.v16 { background: #f59563; color: white; }
.v32 { background: #f67c5f; color: white; }
.v64 { background: #f65e3b; color: white; }
.v128 { background: #edcf72; color: white; }
.v256 { background: #edcc61; color: white; }
.v512 { background: #edc850; color: white; }
.v1024 { background: #edc53f; color: white; }
.v2048 { background: #edc22e; color: white; }

.info {
    color: #a1a5b3;
    text-align: center;
    margin-top: 20px;
    line-height: 1.6;
}

#message {
    text-align: center;
    margin: 12px;
    color: #70a5ff;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">

<header>
    <div class="logo">Avex</div>
    <a href="../index.html">← Zpět do knihovny</a>
</header>

<div class="top">
    <h1>2048</h1>
    <div class="score">
        <small>SKÓRE</small>
        <strong id="score">0</strong>
    </div>
</div>

<button onclick="newGame()">Nová hra</button>

<div id="board"></div>
<div id="message"></div>

<div class="info">
    Spojuj stejné číselné dlaždice.<br>
    Pomocí šipek na klávesnici nebo přejetím prstem posouvej dlaždice.<br>
    Cílem je vytvořit číslo 2048!
</div>

</div>

<script>
let board = [];
let score = 0;
let gameOver = false;

function newGame() {
    board = Array.from({length: 4}, () => Array(4).fill(0));
    score = 0;
    gameOver = false;
    document.getElementById("message").textContent = "";
    addTile();
    addTile();
    draw();
}

function addTile() {
    let empty = [];

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (board[r][c] === 0) empty.push([r,c]);
        }
    }

    if (empty.length === 0) return;

    let [r,c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function draw() {
    const element = document.getElementById("board");
    element.innerHTML = "";

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            let value = board[r][c];
            let cell = document.createElement("div");

            cell.className = "cell" + (value ? " v" + value : "");
            cell.textContent = value || "";

            element.appendChild(cell);
        }
    }

    document.getElementById("score").textContent = score;

    if (board.some(row => row.includes(2048))) {
        document.getElementById("message").textContent = "Gratulujeme! Dosáhl jsi 2048!";
    } else if (!canMove()) {
        gameOver = true;
        document.getElementById("message").textContent = "Konec hry! Zkus to znovu.";
    }
}

function canMove() {
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (board[r][c] === 0) return true;
            if (c < 3 && board[r][c] === board[r][c+1]) return true;
            if (r < 3 && board[r][c] === board[r+1][c]) return true;
        }
    }
    return false;
}

function move(direction) {
    if (gameOver) return;

    let old = JSON.stringify(board);

    for (let i = 0; i < 4; i++) {
        let line = [];

        for (let j = 0; j < 4; j++) {
            let r = direction === "up" ? j :
                    direction === "down" ? 3-j : i;
            let c = direction === "left" ? j :
                    direction === "right" ? 3-j : i;

            line.push(board[r][c]);
        }

        line = line.filter(x => x !== 0);

        for (let j = 0; j < line.length - 1; j++) {
            if (line[j] === line[j+1]) {
                line[j] *= 2;
                score += line[j];
                line.splice(j+1, 1);
            }
        }

        while (line.length < 4) line.push(0);

        for (let j = 0; j < 4; j++) {
            let r = direction === "up" ? j :
                    direction === "down" ? 3-j : i;
            let c = direction === "left" ? j :
                    direction === "right" ? 3-j : i;

            board[r][c] = line[j];
        }
    }

    if (old !== JSON.stringify(board)) {
        addTile();
        draw();
    }
}

document.addEventListener("keydown", e => {
    const keys = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right"
    };

    if (keys[e.key]) {
        e.preventDefault();
        move(keys[e.key]);
    }
});

let startX = 0;
let startY = 0;

document.getElementById("board").addEventListener("touchstart", e => {
    startX = e.changedTouches[0].screenX;
    startY = e.changedTouches[0].screenY;
}, {passive: true});

document.getElementById("board").addEventListener("touchend", e => {
    let dx = e.changedTouches[0].screenX - startX;
    let dy = e.changedTouches[0].screenY - startY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
    } else {
        move(dy > 0 ? "down" : "up");
    }
}, {passive: true});

newGame();
</script>

</body>
</html>
