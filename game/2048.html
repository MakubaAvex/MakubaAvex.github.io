
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 – Avex</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #101116;
    color: #f5f6fa;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 470px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    font-size: 42px;
    margin: 0;
    color: #70a5ff;
}

.score-box {
    background: #191b24;
    padding: 10px 16px;
    border-radius: 10px;
    text-align: center;
}

.score-box span {
    display: block;
    color: #a1a5b3;
    font-size: 12px;
}

.score-box strong {
    font-size: 22px;
}

button {
    border: none;
    border-radius: 9px;
    background: #4285ff;
    color: white;
    padding: 11px 17px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #70a5ff;
}

.description {
    color: #a1a5b3;
    line-height: 1.5;
    margin: 15px 0;
}

.board {
    background: #191b24;
    border-radius: 12px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1;
}

.cell {
    background: #292c38;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(20px, 7vw, 34px);
    font-weight: bold;
    color: #f5f6fa;
}

.v2 { background: #454b5b; }
.v4 { background: #59677f; }
.v8 { background: #356dbb; }
.v16 { background: #285ca8; }
.v32 { background: #214b8b; }
.v64 { background: #183b70; }
.v128 { background: #987b32; font-size: clamp(18px, 6vw, 29px); }
.v256 { background: #b18b27; font-size: clamp(18px, 6vw, 29px); }
.v512 { background: #c69a24; font-size: clamp(18px, 6vw, 29px); }
.v1024 { background: #d2a51e; font-size: clamp(15px, 5vw, 25px); }
.v2048 { background: #e6b817; color: #171717; font-size: clamp(15px, 5vw, 25px); }

.message {
    text-align: center;
    min-height: 30px;
    margin: 15px 0;
    color: #70a5ff;
    font-weight: bold;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    gap: 10px;
}

a {
    color: #70a5ff;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

@media (max-width: 380px) {
    .board { gap: 6px; padding: 7px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>2048</h1>

        <div class="score-box">
            <span>SKÓRE</span>
            <strong id="score">0</strong>
        </div>
    </div>

    <button onclick="newGame()">Nová hra</button>

    <p class="description">
        Spojuj stejné číselné dlaždice pomocí šipek na klávesnici.
        Cílem je vytvořit číslo 2048!
    </p>

    <div class="board" id="board"></div>

    <div class="message" id="message"></div>

    <div class="bottom">
        <a href="../index.html">← Zpět do Avex</a>

        <div class="score-box">
            <span>NEJLEPŠÍ SKÓRE</span>
            <strong id="best">0</strong>
        </div>
    </div>

</div>

<script>
let grid = [];
let score = 0;
let best = Number(localStorage.getItem("avex2048best")) || 0;
let won = false;
let gameOver = false;

const board = document.getElementById("board");

function newGame() {
    grid = Array.from({length: 4}, () => [0, 0, 0, 0]);
    score = 0;
    won = false;
    gameOver = false;

    document.getElementById("message").textContent = "";

    addTile();
    addTile();
    draw();
}

function addTile() {
    let empty = [];

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) {
                empty.push([r, c]);
            }
        }
    }

    if (empty.length === 0) return;

    let [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function draw() {
    board.innerHTML = "";

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            let value = grid[r][c];
            let cell = document.createElement("div");

            cell.className = "cell";

            if (value > 0) {
                cell.textContent = value;
                cell.classList.add("v" + value);
            }

            board.appendChild(cell);
        }
    }

    document.getElementById("score").textContent = score;
    document.getElementById("best").textContent = best;
}

function slide(row) {
    let arr = row.filter(x => x !== 0);

    for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            score += arr[i];
            arr.splice(i + 1, 1);

            if (arr[i] === 2048 && !won) {
                won = true;
                document.getElementById("message").textContent =
                    "Gratulujeme! Dosáhl jsi 2048!";
            }
        }
    }

    while (arr.length < 4) arr.push(0);

    return arr;
}

function move(direction) {
    if (gameOver) return;

    let old = JSON.stringify(grid);

    if (direction === "left") {
        for (let r = 0; r < 4; r++) {
            grid[r] = slide(grid[r]);
        }
    }

    if (direction === "right") {
        for (let r = 0; r < 4; r++) {
            grid[r] = slide(grid[r].slice().reverse()).reverse();
        }
    }

    if (direction === "up") {
        for (let c = 0; c < 4; c++) {
            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(grid[r][c]);
            }

            column = slide(column);

            for (let r = 0; r < 4; r++) {
                grid[r][c] = column[r];
            }
        }
    }

    if (direction === "down") {
        for (let c = 0; c < 4; c++) {
            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(grid[r][c]);
            }

            column = slide(column.reverse()).reverse();

            for (let r = 0; r < 4; r++) {
                grid[r][c] = column[r];
            }
        }
    }

    if (old !== JSON.stringify(grid)) {
        addTile();
    }

    if (score > best) {
        best = score;
        localStorage.setItem("avex2048best", best);
    }

    draw();
    checkGameOver();
}

function checkGameOver() {
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) return;

            if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
            if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
        }
    }

    gameOver = true;
    document.getElementById("message").textContent =
        "Konec hry! Zkus to znovu.";
}

document.addEventListener("keydown", function(e) {
    const keys = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down"
    };

    if (keys[e.key]) {
        e.preventDefault();
        move(keys[e.key]);
    }
});

let touchStartX = 0;
let touchStartY = 0;

board.addEventListener("touchstart", function(e) {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

board.addEventListener("touchend", function(e) {
    let dx = e.changedTouches[0].screenX - touchStartX;
    let dy = e.changedTouches[0].screenY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
    } else {
        move(dy > 0 ? "down" : "up");
    }
}, {passive: true});

newGame();
</script>

</body>
</html>
