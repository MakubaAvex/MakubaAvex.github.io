
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 – Avex</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background: #101116;
    color: #f5f6fa;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 470px;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    font-size: 42px;
    margin: 0;
    color: #70a5ff;
}

.score-box {
    background: #191b24;
    padding: 10px 16px;
    border-radius: 10px;
    text-align: center;
}

.score-box span {
    display: block;
    color: #a1a5b3;
    font-size: 12px;
}

.score-box strong {
    font-size: 22px;
}

button {
    border: none;
    border-radius: 9px;
    background: #4285ff;
    color: white;
    padding: 11px 17px;
    font-size: 15px;
    cursor: pointer;
    font-weight: bold;
}

button:hover { background: #70a5ff; }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.description {
    color: #a1a5b3;
    line-height: 1.5;
    margin: 15px 0;
}

.board {
    background: #191b24;
    border-radius: 12px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1;
}

.cell {
    background: #292c38;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(20px, 7vw, 34px);
    font-weight: bold;
    color: #f5f6fa;
}

.v2 { background: #454b5b; }
.v4 { background: #59677f; }
.v8 { background: #356dbb; }
.v16 { background: #285ca8; }
.v32 { background: #214b8b; }
.v64 { background: #183b70; }
.v128 { background: #987b32; font-size: clamp(18px, 6vw, 29px); }
.v256 { background: #b18b27; font-size: clamp(18px, 6vw, 29px); }
.v512 { background: #c69a24; font-size: clamp(18px, 6vw, 29px); }
.v1024 { background: #d2a51e; font-size: clamp(15px, 5vw, 25px); }
.v2048 { background: #e6b817; color: #171717; font-size: clamp(15px, 5vw, 25px); }

.message {
    text-align: center;
    min-height: 30px;
    margin: 15px 0;
    color: #70a5ff;
    font-weight: bold;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 15px;
    gap: 10px;
    flex-wrap: wrap;
}

a {
    color: #70a5ff;
    text-decoration: none;
}

a:hover { text-decoration: underline; }

.account-info {
    color: #a1a5b3;
    font-size: 13px;
    margin: 12px 0;
}

.game-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

#leaderboardModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    background: #191b24;
    border: 1px solid #303442;
    border-radius: 14px;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 20px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.modal-header h2 {
    color: #70a5ff;
    margin: 0;
}

.close-button {
    background: #303442;
    padding: 7px 12px;
}

.leaderboard-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
}

.leaderboard-table th,
.leaderboard-table td {
    padding: 10px 6px;
    border-bottom: 1px solid #303442;
}

.leaderboard-table th {
    color: #a1a5b3;
    font-size: 13px;
}

.leaderboard-table td:last-child,
.leaderboard-table th:last-child {
    text-align: right;
}

.my-row {
    background: #263753;
}

.leaderboard-section {
    color: #70a5ff;
    font-weight: bold;
    margin: 20px 0 8px;
}

.leaderboard-message {
    color: #a1a5b3;
    text-align: center;
    padding: 20px 0;
}

@media (max-width: 380px) {
    .board { gap: 6px; padding: 7px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <h1>2048</h1>

        <div class="score-box">
            <span>SKÓRE</span>
            <strong id="score">0</strong>
        </div>
    </div>

    <div class="game-buttons">
        <button onclick="newGame()">Nová hra</button>
        <button id="leaderboardButton" onclick="openLeaderboard()" style="display:none">
            Žebříček
        </button>
    </div>

    <div class="account-info" id="accountInfo">
        Hraješ jako host. Skóre se neukládá.
    </div>

    <p class="description">
        Spojuj stejné číselné dlaždice pomocí šipek na klávesnici.
        Cílem je vytvořit číslo 2048!
    </p>

    <div class="board" id="board"></div>

    <div class="message" id="message"></div>

    <div class="bottom">
        <a href="../index.html">← Zpět do Avex</a>

        <div class="score-box" id="bestBox" style="display:none">
            <span>MOJE NEJLEPŠÍ SKÓRE</span>
            <strong id="best">0</strong>
        </div>
    </div>

</div>

<div id="leaderboardModal">
    <div class="modal-content">

        <div class="modal-header">
            <h2>Žebříček 2048</h2>
            <button class="close-button" onclick="closeLeaderboard()">Zavřít</button>
        </div>

        <div id="leaderboardContent" class="leaderboard-message">
            Načítám žebříček...
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mghongtuoveswcrezymp.supabase.co";
const SUPABASE_KEY = "sb_publishable_AKH-a8L3407qbAyqjtwV7Q__DlLMJaY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let remoteBest = 0;
let lastSentScore = 0;

let grid = [];
let score = 0;
let won = false;
let gameOver = false;

const board = document.getElementById("board");

async function updateAccount() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (error) {
        console.error("Chyba účtu:", error);
        return;
    }

    currentUser = data.session ? data.session.user : null;

    const accountInfo = document.getElementById("accountInfo");
    const leaderboardButton = document.getElementById("leaderboardButton");
    const bestBox = document.getElementById("bestBox");

    if (currentUser) {
        accountInfo.textContent = "Jsi přihlášený přes Makuba ID.";
        leaderboardButton.style.display = "inline-block";
        bestBox.style.display = "block";

        await loadMyBest();
    } else {
        accountInfo.textContent = "Hraješ jako host. Skóre se neukládá.";
        leaderboardButton.style.display = "none";
        bestBox.style.display = "none";
        remoteBest = 0;
    }
}

async function loadMyBest() {
    if (!currentUser) return;

    const { data, error } = await supabaseClient.rpc(
        "get_game_leaderboard",
        { p_game: "2048" }
    );

    if (error) {
        console.error("Chyba načítání skóre:", error);
        return;
    }

    const myRow = (data || []).find(row => row.is_me === true);

    remoteBest = myRow ? Number(myRow.best_score) : 0;
    lastSentScore = remoteBest;

    document.getElementById("best").textContent = remoteBest;
}

async function saveScore() {
    if (!currentUser || score <= remoteBest || score <= lastSentScore) {
        return;
    }

    const scoreToSave = score;
    lastSentScore = scoreToSave;

    const { error } = await supabaseClient.rpc(
        "save_game_score",
        {
            p_game: "2048",
            p_score: scoreToSave
        }
    );

    if (error) {
        console.error("Chyba ukládání skóre:", error);

        if (lastSentScore === scoreToSave) {
            lastSentScore = remoteBest;
        }

        return;
    }

    remoteBest = Math.max(remoteBest, scoreToSave);
    document.getElementById("best").textContent = remoteBest;
}

async function openLeaderboard() {
    if (!currentUser) return;

    const modal = document.getElementById("leaderboardModal");
    const content = document.getElementById("leaderboardContent");

    modal.style.display = "flex";
    content.textContent = "Načítám žebříček...";

    const { data, error } = await supabaseClient.rpc(
        "get_game_leaderboard",
        { p_game: "2048" }
    );

    if (error) {
        console.error("Chyba žebříčku:", error);
        content.textContent = "Žebříček se nepodařilo načíst.";
        return;
    }

    renderLeaderboard(data || []);
}

function renderLeaderboard(rows) {
    const content = document.getElementById("leaderboardContent");
    content.innerHTML = "";

    if (rows.length === 0) {
        content.textContent = "Zatím tu nejsou žádné výsledky. Zahraj si první hru!";
        return;
    }

    const top100 = rows.filter(row => Number(row.rank_number) <= 100);
    const myRow = rows.find(row => row.is_me === true);
    const myRank = myRow ? Number(myRow.rank_number) : null;

    function makeTable(items) {
        const table = document.createElement("table");
        table.className = "leaderboard-table";

        const thead = document.createElement("thead");
        const header = document.createElement("tr");

        ["Pořadí", "Účet", "Skóre"].forEach(label => {
            const th = document.createElement("th");
            th.textContent = label;
            header.appendChild(th);
        });

        thead.appendChild(header);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        items.forEach(row => {
            const tr = document.createElement("tr");

            if (row.is_me) {
                tr.className = "my-row";
            }

            const rank = document.createElement("td");
            rank.textContent = Number(row.rank_number) + ".";

            const username = document.createElement("td");
            username.textContent = row.username;

            const points = document.createElement("td");
            points.textContent = Number(row.best_score).toLocaleString("cs-CZ");

            tr.appendChild(rank);
            tr.appendChild(username);
            tr.appendChild(points);

            tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        return table;
    }

    const topTitle = document.createElement("div");
    topTitle.className = "leaderboard-section";
    topTitle.textContent = "TOP 100";
    content.appendChild(topTitle);

    if (top100.length > 0) {
        content.appendChild(makeTable(top100));
    } else {
        const empty = document.createElement("p");
        empty.textContent = "Zatím tu nejsou žádné výsledky.";
        content.appendChild(empty);
    }

    if (myRow && myRank > 100) {
        const myTitle = document.createElement("div");
        myTitle.className = "leaderboard-section";
        myTitle.textContent = "TVOJE UMÍSTĚNÍ";
        content.appendChild(myTitle);

        content.appendChild(makeTable([myRow]));
    }
}

function closeLeaderboard() {
    document.getElementById("leaderboardModal").style.display = "none";
}

document.getElementById("leaderboardModal").addEventListener("click", function(e) {
    if (e.target === this) closeLeaderboard();
});

let authListenerStarted = false;

async function startAuth() {
    await updateAccount();

    if (!authListenerStarted) {
        authListenerStarted = true;

        supabaseClient.auth.onAuthStateChange(() => {
            setTimeout(() => {
                updateAccount();
            }, 0);
        });
    }
}

function newGame() {
    grid = Array.from({length: 4}, () => [0, 0, 0, 0]);
    score = 0;
    won = false;
    gameOver = false;

    document.getElementById("message").textContent = "";

    addTile();
    addTile();
    draw();
}

function addTile() {
    let empty = [];

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) {
                empty.push([r, c]);
            }
        }
    }

    if (empty.length === 0) return;

    let [r, c] = empty[Math.floor(Math.random() * empty.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
}

function draw() {
    board.innerHTML = "";

    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            let value = grid[r][c];
            let cell = document.createElement("div");

            cell.className = "cell";

            if (value > 0) {
                cell.textContent = value;
                cell.classList.add("v" + value);
            }

            board.appendChild(cell);
        }
    }

    document.getElementById("score").textContent = score;
}

function slide(row) {
    let arr = row.filter(x => x !== 0);

    for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            score += arr[i];
            arr.splice(i + 1, 1);

            if (arr[i] === 2048 && !won) {
                won = true;
                document.getElementById("message").textContent =
                    "Gratulujeme! Dosáhl jsi 2048!";
            }
        }
    }

    while (arr.length < 4) arr.push(0);

    return arr;
}

function move(direction) {
    if (gameOver) return;

    let old = JSON.stringify(grid);
    let oldScore = score;

    if (direction === "left") {
        for (let r = 0; r < 4; r++) {
            grid[r] = slide(grid[r]);
        }
    }

    if (direction === "right") {
        for (let r = 0; r < 4; r++) {
            grid[r] = slide(grid[r].slice().reverse()).reverse();
        }
    }

    if (direction === "up") {
        for (let c = 0; c < 4; c++) {
            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(grid[r][c]);
            }

            column = slide(column);

            for (let r = 0; r < 4; r++) {
                grid[r][c] = column[r];
            }
        }
    }

    if (direction === "down") {
        for (let c = 0; c < 4; c++) {
            let column = [];

            for (let r = 0; r < 4; r++) {
                column.push(grid[r][c]);
            }

            column = slide(column.reverse()).reverse();

            for (let r = 0; r < 4; r++) {
                grid[r][c] = column[r];
            }
        }
    }

    if (old !== JSON.stringify(grid)) {
        addTile();
    }

    if (score > oldScore) {
        saveScore();
    }

    draw();
    checkGameOver();
}

function checkGameOver() {
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) return;

            if (c < 3 && grid[r][c] === grid[r][c + 1]) return;
            if (r < 3 && grid[r][c] === grid[r + 1][c]) return;
        }
    }

    gameOver = true;
    document.getElementById("message").textContent =
        "Konec hry! Zkus to znovu.";
}

document.addEventListener("keydown", function(e) {
    const keys = {
        ArrowLeft: "left",
        ArrowRight: "right",
        ArrowUp: "up",
        ArrowDown: "down"
    };

    if (keys[e.key]) {
        e.preventDefault();
        move(keys[e.key]);
    }
});

let touchStartX = 0;
let touchStartY = 0;

board.addEventListener("touchstart", function(e) {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

board.addEventListener("touchend", function(e) {
    let dx = e.changedTouches[0].screenX - touchStartX;
    let dy = e.changedTouches[0].screenY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

    if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
    } else {
        move(dy > 0 ? "down" : "up");
    }
}, {passive: true});

newGame();
startAuth();
</script>

</body>
</html>
