
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avex – Herní portál</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #101116;
    color: #f5f6fa;
    min-height: 100vh;
}

header {
    min-height: 70px;
    padding: 12px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    background: #15161d;
    border-bottom: 1px solid #292b35;
}

.logo {
    color: white;
    text-decoration: none;
    font-size: 28px;
    font-weight: bold;
}

.account-area {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    cursor: pointer;
    font-family: inherit;
}

.auth-button {
    padding: 10px 15px;
    border-radius: 7px;
    border: 1px solid #4285ff;
    background: transparent;
    color: white;
    font-size: 14px;
}

.auth-button.primary {
    background: #4285ff;
}

.auth-button:hover {
    opacity: 0.85;
}

#accountName {
    color: #c4c7d1;
    font-size: 14px;
}

main {
    width: 86%;
    max-width: 1200px;
    margin: 55px auto;
}

.hero {
    margin-bottom: 40px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.hero p {
    color: #a1a5b3;
    font-size: 16px;
}

.search-box {
    margin: 30px 0;
}

.search-box input {
    width: 100%;
    padding: 16px 18px;
    border-radius: 9px;
    border: 1px solid #303340;
    outline: none;
    background: #191b24;
    color: white;
    font-size: 16px;
}

.search-box input:focus {
    border-color: #4285ff;
}

.categories {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 35px;
}

.category {
    padding: 11px 17px;
    border: 1px solid #303340;
    border-radius: 8px;
    background: #191b24;
    color: #c4c7d1;
    font-size: 14px;
}

.category:hover {
    background: #222633;
}

.category.active {
    background: #4285ff;
    border-color: #4285ff;
    color: white;
}

.section-title {
    font-size: 24px;
    margin-bottom: 22px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
}

.game {
    background: #191b24;
    border: 1px solid #292d3a;
    border-radius: 12px;
    overflow: hidden;
    transition: 0.2s;
}

.game:hover {
    transform: translateY(-4px);
    border-color: #4285ff;
}

.game a {
    display: block;
    text-decoration: none;
    color: white;
}

.game-image {
    height: 155px;
    background: #222633;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game h3 {
    padding: 17px;
    font-size: 18px;
}

.game[hidden] {
    display: none !important;
}

.no-results {
    display: none;
    color: #a1a5b3;
    text-align: center;
    padding: 35px 10px;
}

/* Přihlašovací okno */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.78);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal.show {
    display: flex;
}

.modal-content {
    width: 100%;
    max-width: 420px;
    background: #191b24;
    border: 1px solid #303340;
    border-radius: 14px;
    padding: 28px;
    position: relative;
}

.modal-content h2 {
    margin-bottom: 20px;
    font-size: 25px;
}

.close-modal {
    position: absolute;
    top: 15px;
    right: 17px;
    background: none;
    border: none;
    color: #a1a5b3;
    font-size: 25px;
}

.auth-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
}

.auth-tab {
    flex: 1;
    padding: 11px;
    border: 1px solid #303340;
    border-radius: 7px;
    background: #222633;
    color: white;
}

.auth-tab.active {
    background: #4285ff;
    border-color: #4285ff;
}

.auth-input {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 13px;
    background: #101116;
    border: 1px solid #303340;
    border-radius: 7px;
    color: white;
    font-size: 15px;
    outline: none;
}

.auth-input:focus {
    border-color: #4285ff;
}

.submit-auth {
    width: 100%;
    padding: 13px;
    margin-top: 5px;
    background: #4285ff;
    border: none;
    border-radius: 7px;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

.submit-auth:disabled {
    opacity: 0.6;
    cursor: wait;
}

.auth-message {
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
    color: #c4c7d1;
    overflow-wrap: anywhere;
}

.auth-message.error {
    color: #ff7777;
}

.auth-message.success {
    color: #69d99b;
}

@media (max-width: 600px) {
    header {
        padding: 12px 5%;
    }

    main {
        width: 90%;
        margin-top: 35px;
    }

    .hero h1 {
        font-size: 30px;
    }

    .games {
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 13px;
    }

    .game-image {
        height: 125px;
    }

    .account-area {
        justify-content: flex-end;
    }
}
</style>
</head>

<body>

<header>
    <a class="logo" href="index.html">Avex</a>

    <div class="account-area" id="accountArea">
        <button class="auth-button" id="openLogin">Přihlásit se</button>
        <button class="auth-button primary" id="openRegister">Registrovat se</button>
    </div>
</header>

<main>

    <section class="hero">
        <h1>Vítej na Avexu</h1>
        <p>Objevuj hry a zahraj si přímo ve svém prohlížeči.</p>
    </section>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Hledat hry..."
            autocomplete="off"
        >
    </div>

    <div class="categories">
        <button class="category active" data-category="all">Všechny hry</button>
        <button class="category" data-category="action">Akční hry</button>
        <button class="category" data-category="strategy">Strategické hry</button>
        <button class="category" data-category="adventure">Dobrodružné hry</button>
        <button class="category" data-category="logic">Logické hry</button>
    </div>

    <h2 class="section-title">Herní knihovna</h2>

    <div class="games" id="games">

        <article class="game"
                 data-category="logic"
                 data-name="2048 logická hra čísla">

            <a href="game/2048.html">
                <div class="game-image">
                    <div style="
                        display:grid;
                        grid-template-columns:repeat(2,65px);
                        gap:7px;
                        transform:rotate(-6deg);
                    ">
                        <div style="background:#eee4da;color:#776e65;padding:18px 0;text-align:center;border-radius:7px;font-size:22px;font-weight:bold;">2</div>
                        <div style="background:#ede0c8;color:#776e65;padding:18px 0;text-align:center;border-radius:7px;font-size:22px;font-weight:bold;">4</div>
                        <div style="background:#f2b179;color:white;padding:18px 0;text-align:center;border-radius:7px;font-size:22px;font-weight:bold;">8</div>
                        <div style="background:#edcf72;color:white;padding:18px 0;text-align:center;border-radius:7px;font-size:22px;font-weight:bold;">16</div>
                    </div>
                </div>
                <h3>2048</h3>
            </a>
        </article>

        <article class="game"
                 data-category="logic"
                 data-name="tetris logická hra kostky">

            <a href="game/tetris.html">
                <div class="game-image">
                    <div style="
                        display:grid;
                        grid-template-columns:repeat(4,27px);
                        gap:4px;
                        transform:rotate(-8deg);
                    ">
                        <div style="background:#36c5f0;height:27px;border-radius:4px"></div>
                        <div style="background:#36c5f0;height:27px;border-radius:4px"></div>
                        <div style="background:#36c5f0;height:27px;border-radius:4px"></div>
                        <div style="background:#36c5f0;height:27px;border-radius:4px"></div>
                        <div style="background:#f5a623;height:27px;border-radius:4px"></div>
                        <div style="background:#f5a623;height:27px;border-radius:4px"></div>
                        <div style="background:#45c878;height:27px;border-radius:4px"></div>
                        <div style="background:#45c878;height:27px;border-radius:4px"></div>
                        <div style="background:#b45cff;height:27px;border-radius:4px"></div>
                        <div style="background:#b45cff;height:27px;border-radius:4px"></div>
                        <div style="background:#b45cff;height:27px;border-radius:4px"></div>
                    </div>
                </div>
                <h3>Tetris</h3>
            </a>
        </article>

    </div>

    <div class="no-results" id="noResults">
        Žádné hry nebyly nalezeny.
    </div>

</main>

<!-- Přihlašovací okno -->

<div class="modal" id="authModal">
    <div class="modal-content">

        <button class="close-modal" id="closeModal">&times;</button>

        <h2>Makuba ID</h2>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab">Přihlášení</button>
            <button class="auth-tab" id="registerTab">Registrace</button>
        </div>

        <form id="authForm">

            <input
                class="auth-input"
                id="username"
                type="text"
                placeholder="Uživatelské jméno"
                minlength="3"
                maxlength="20"
                autocomplete="username"
                style="display:none"
            >

            <input
                class="auth-input"
                id="email"
                type="email"
                placeholder="E-mail"
                autocomplete="email"
                required
            >

            <input
                class="auth-input"
                id="password"
                type="password"
                placeholder="Heslo (minimálně 8 znaků)"
                minlength="8"
                autocomplete="current-password"
                required
            >

            <button class="submit-auth" id="submitAuth" type="submit">
                Přihlásit se
            </button>

        </form>

        <div class="auth-message" id="authMessage" aria-live="polite"></div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* Makuba ID – připojení k Supabase */

const SUPABASE_URL = "https://mghongtuoveswcrezymp.supabase.co";

const SUPABASE_KEY = "sb_publishable_AKH-a8L3407qbAyqjtwV7Q__DlLMJaY";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* Vyhledávání her */

const search = document.getElementById("search");
const categoryButtons = document.querySelectorAll(".category");
const games = document.querySelectorAll(".game");
const noResults = document.getElementById("noResults");

let selectedCategory = "all";

function normalize(text) {
    return text
        .toLocaleLowerCase("cs")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function filterGames() {
    const searchText = normalize(search.value.trim());
    let visibleCount = 0;

    games.forEach(function(game) {
        const category = game.dataset.category || "";
        const name = normalize(
            (game.dataset.name || "") + " " + game.textContent
        );

        const matchesCategory =
            selectedCategory === "all" ||
            category === selectedCategory;

        const matchesSearch = name.includes(searchText);

        game.hidden = !(matchesCategory && matchesSearch);

        if (!game.hidden) {
            visibleCount++;
        }
    });

    noResults.style.display =
        visibleCount === 0 ? "block" : "none";
}

search.addEventListener("input", filterGames);

categoryButtons.forEach(function(button) {
    button.addEventListener("click", function() {
        categoryButtons.forEach(function(item) {
            item.classList.remove("active");
        });

        button.classList.add("active");
        selectedCategory = button.dataset.category;

        filterGames();
    });
});

/* Makuba ID – registrace a přihlášení */

const modal = document.getElementById("authModal");
const openLogin = document.getElementById("openLogin");
const openRegister = document.getElementById("openRegister");
const closeModal = document.getElementById("closeModal");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const authForm = document.getElementById("authForm");
const usernameInput = document.getElementById("username");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const submitAuth = document.getElementById("submitAuth");
const authMessage = document.getElementById("authMessage");
const accountArea = document.getElementById("accountArea");

let authMode = "login";

function showMessage(message, type = "") {
    authMessage.textContent = message;
    authMessage.className = "auth-message " + type;
}

function setMode(mode) {
    authMode = mode;

    const registering = mode === "register";

    usernameInput.style.display = registering ? "block" : "none";
    usernameInput.required = registering;

    passwordInput.autocomplete = registering
        ? "new-password"
        : "current-password";

    loginTab.classList.toggle("active", !registering);
    registerTab.classList.toggle("active", registering);

    submitAuth.textContent = registering
        ? "Vytvořit účet"
        : "Přihlásit se";

    showMessage("");
}

function openModal(mode) {
    setMode(mode);
    modal.classList.add("show");
}

openLogin.addEventListener("click", function() {
    openModal("login");
});

openRegister.addEventListener("click", function() {
    openModal("register");
});

closeModal.addEventListener("click", function() {
    modal.classList.remove("show");
});

modal.addEventListener("click", function(event) {
    if (event.target === modal) {
        modal.classList.remove("show");
    }
});

loginTab.addEventListener("click", function() {
    setMode("login");
});

registerTab.addEventListener("click", function() {
    setMode("register");
});

/* Registrace a přihlášení */

authForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    submitAuth.disabled = true;
    showMessage("Pracuji...");

    try {

        if (authMode === "register") {

            const username = usernameInput.value.trim();

            if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
                throw new Error(
                    "Uživatelské jméno musí mít 3–20 znaků a obsahovat pouze písmena bez diakritiky, čísla nebo podtržítko."
                );
            }

            if (password.length < 8) {
                throw new Error("Heslo musí mít alespoň 8 znaků.");
            }

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        username: username
                    },
                    emailRedirectTo: window.location.origin + window.location.pathname
                }
            });

            if (error) throw error;

            if (data.session) {
                showMessage("Účet byl vytvořen a jsi přihlášen!", "success");
                authForm.reset();
                modal.classList.remove("show");
                await updateAccount(data.session.user);
            } else {
                showMessage(
                    "Registrace proběhla. Zkontroluj svůj e-mail a potvrď registraci. Potom se můžeš přihlásit.",
                    "success"
                );
                authForm.reset();
            }

        } else {

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) throw error;

            showMessage("Přihlášení proběhlo úspěšně!", "success");
            authForm.reset();
            modal.classList.remove("show");

            await updateAccount(data.user);
        }

    } catch (error) {
        showMessage(error.message || "Nastala chyba.", "error");
    } finally {
        submitAuth.disabled = false;
    }
});

/* Načtení účtu */

async function updateAccount(user) {

    if (!user) {
        accountArea.innerHTML = `
            <button class="auth-button" id="openLogin">Přihlásit se</button>
            <button class="auth-button primary" id="openRegister">Registrovat se</button>
        `;

        document.getElementById("openLogin").addEventListener(
            "click", function() { openModal("login"); }
        );

        document.getElementById("openRegister").addEventListener(
            "click", function() { openModal("register"); }
        );

        return;
    }

    let username = user.user_metadata?.username || "Uživatel";

    const { data: profile, error } = await supabaseClient
        .from("profiles")
        .select("username")
        .eq("id", user.id)
        .maybeSingle();

    if (!error && profile && profile.username) {
        username = profile.username;
    }

    const safeUsername = String(username).replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });

    accountArea.innerHTML = `
        <span id="accountName">${safeUsername}</span>
        <button class="auth-button" id="logoutButton">Odhlásit se</button>
    `;

    document.getElementById("logoutButton").addEventListener(
        "click", logout
    );
}

/* Odhlášení */

async function logout() {
    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        alert("Odhlášení se nepodařilo: " + error.message);
        return;
    }

    await updateAccount(null);
}

/* Kontrola přihlášení při načtení stránky */

async function initializeAuth() {
    const { data, error } = await supabaseClient.auth.getSession();

    if (!error) {
        await updateAccount(data.session?.user || null);
    }
}

supabaseClient.auth.onAuthStateChange(function(event, session) {
    setTimeout(function() {
        updateAccount(session?.user || null);
    }, 0);
});

filterGames();
initializeAuth();
</script>

</body>
</html>
